name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  worker-and-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify:p0
      - run: npm run verify:agent
      - run: npm run verify:p1
      - run: npm run verify:p1:e2e
      - run: npm run verify:web
      - run: node --check agent/real/src/scan-agent.js
      - run: npx wrangler deploy --dry-run --config wrangler.toml

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infra/tencent
      - run: terraform -chdir=infra/tencent init -backend=false
      - run: terraform -chdir=infra/tencent validate
      - run: terraform -chdir=infra/tencent/bootstrap init -backend=false
      - run: terraform -chdir=infra/tencent/bootstrap validate

  agent-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: agent/real
          push: false
          tags: scan-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
