name: staging-dryrun-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-dryrun-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      STAGING_BASE_URL: ${{ vars.CALLBACK_BASE_URL }}
      STAGING_ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
      ACCEPTANCE_CLEANUP_WAIT_MS: "120000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify staging dry-run Provider and Queue canary
        run: node scripts/run-staging-mock-acceptance.mjs verify-dry-run
