name: build-and-sign-agent

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable release label
        required: true
        default: p1

permissions:
  contents: read
  id-token: write

concurrency:
  group: tencent-registry-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: tencent-registry
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - id: registry_network
        name: Publish runner egress IP and wait for temporary TCR ACL
        env:
          TCR_HOST: ${{ vars.TCR_HOST }}
        run: |
          set -euo pipefail
          [[ -n "$TCR_HOST" ]] || { echo 'TCR_HOST is required' >&2; exit 1; }

          RUNNER_IP="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 https://api.ipify.org)"
          [[ "$RUNNER_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo 'Unable to determine a valid runner IPv4 address' >&2; exit 1; }
          RUNNER_CIDR="${RUNNER_IP}/32"
          printf 'runner_ip=%s\nrunner_cidr=%s\n' "$RUNNER_IP" "$RUNNER_CIDR" >> "$GITHUB_OUTPUT"
          {
            echo '### Temporary TCR public ACL required'
            echo
            echo "Add \`$RUNNER_CIDR\` to the \`$TCR_HOST\` public allowlist."
            echo 'Do not use the all-public shortcut. Remove this exact entry after the workflow completes.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Temporary TCR ACL::Add $RUNNER_CIDR to $TCR_HOST; this job will wait up to 15 minutes."

          DEADLINE=$((SECONDS + 900))
          while (( SECONDS < DEADLINE )); do
            HTTP_CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 10 "https://${TCR_HOST}/v2/" || true)"
            if [[ "$HTTP_CODE" == '200' || "$HTTP_CODE" == '401' ]]; then
              echo "TCR registry endpoint is reachable (HTTP $HTTP_CODE)."
              exit 0
            fi
            sleep 10
          done

          echo "Timed out waiting for temporary TCR ACL entry $RUNNER_CIDR" >&2
          exit 1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ vars.TCR_HOST }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD_CURRENT }}
      - id: image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          TCR_HOST: ${{ vars.TCR_HOST }}
          TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
          TCR_REPOSITORY: ${{ vars.TCR_REPOSITORY }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,39}$ ]] || { echo 'image_tag must be a lowercase OCI-safe label' >&2; exit 1; }
          printf 'uri=%s/%s/%s:%s-%s\n' "$TCR_HOST" "$TCR_NAMESPACE" "$TCR_REPOSITORY" "$IMAGE_TAG" "${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: agent/real
          push: true
          tags: ${{ steps.image.outputs.uri }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.uri }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: agent-image.spdx.json
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: cosign sign --yes "${{ steps.image.outputs.uri }}@${{ steps.build.outputs.digest }}"
      - run: cosign verify "${{ steps.image.outputs.uri }}@${{ steps.build.outputs.digest }}" --certificate-identity-regexp="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-agent.yml@refs/.+$" --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-sbom
          path: agent-image.spdx.json
      - name: Publish immutable digest
        run: echo "TENCENT_EKS_CI_IMAGE=${{ steps.image.outputs.uri }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
      - if: always() && steps.registry_network.outputs.runner_cidr != ''
        name: Remind operator to remove temporary TCR ACL
        env:
          RUNNER_CIDR: ${{ steps.registry_network.outputs.runner_cidr }}
          TCR_HOST: ${{ vars.TCR_HOST }}
        run: |
          {
            echo
            echo '### TCR ACL cleanup required'
            echo
            echo "Remove \`$RUNNER_CIDR\` from the \`$TCR_HOST\` public allowlist now."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=TCR ACL cleanup::Remove $RUNNER_CIDR from $TCR_HOST now."
