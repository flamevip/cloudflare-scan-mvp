name: build-and-sign-agent

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable release label
        required: true
        default: p1

permissions:
  contents: read
  id-token: write

concurrency:
  group: aliyun-acr-agent-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: agent-image-publish
    env:
      ACR_REGISTRY: registry-intl.cn-chengdu.aliyuncs.com
      ACR_IMAGE_REPOSITORY: registry-intl.cn-chengdu.aliyuncs.com/70v2ray/scan-agent-cloud
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      - id: image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[a-z0-9][a-z0-9._-]{0,39}$ ]] || { echo 'image_tag must be a lowercase OCI-safe label' >&2; exit 1; }
          printf 'tag_uri=%s:%s-%s\n' "$ACR_IMAGE_REPOSITORY" "$IMAGE_TAG" "${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          printf 'repository=%s\n' "$ACR_IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: agent/real
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag_uri }}
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: agent-image.spdx.json
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - run: cosign sign --yes "${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}"
      - run: cosign verify "${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}" --certificate-identity-regexp="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-agent.yml@refs/.+$" --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      - name: Prove the immutable image is anonymously pullable
        run: |
          docker logout "$ACR_REGISTRY"
          docker buildx imagetools inspect "${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-sbom
          path: agent-image.spdx.json
      - name: Publish immutable digest
        run: echo "TENCENT_EKS_CI_IMAGE=${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
