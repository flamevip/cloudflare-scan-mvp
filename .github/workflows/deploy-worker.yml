name: deploy-worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Environment
        required: true
        type: choice
        options: [staging, pilot]
      enable_live_provider:
        description: Disable application dry-run after protected-environment approval
        required: true
        type: boolean
        default: false
      approval_reference:
        description: Required change/approval reference when live provider is enabled
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify the approved digest signature
        env:
          IMAGE: ${{ vars.TENCENT_EKS_CI_IMAGE }}
        run: cosign verify "$IMAGE" --certificate-identity-regexp="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-agent.yml@refs/.+$" --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      - name: Enforce live-provider approval reference
        if: inputs.enable_live_provider
        env:
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: test -n "$APPROVAL_REFERENCE" || { echo 'approval_reference is required for a live provider deployment' >&2; exit 1; }
      - name: Render isolated Wrangler configuration
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          WORKER_CUSTOM_DOMAIN: ${{ vars.WORKER_CUSTOM_DOMAIN }}
          ENVIRONMENT: ${{ inputs.environment }}
          TOKEN_SCOPE_ENFORCEMENT: ${{ inputs.environment == 'pilot' && 'enforce' || 'report' }}
          CALLBACK_BASE_URL: ${{ vars.CALLBACK_BASE_URL }}
          AGENT_SCAN_MODE: ${{ inputs.environment == 'pilot' && 'real_toolchain' || 'mock' }}
          AGENT_MAX_CANDIDATES: ${{ inputs.environment == 'pilot' && '100' || '100' }}
          TASK_MAX_RETRY: ${{ inputs.environment == 'pilot' && '0' || '1' }}
          TENCENT_EKS_CI_REGION: ${{ vars.TENCENT_EKS_CI_REGION }}
          TENCENT_EKS_CI_VPC_ID: ${{ vars.TENCENT_EKS_CI_VPC_ID }}
          TENCENT_EKS_CI_SUBNET_ID: ${{ vars.TENCENT_EKS_CI_SUBNET_ID }}
          TENCENT_EKS_CI_SECURITY_GROUP_IDS: ${{ vars.TENCENT_EKS_CI_SECURITY_GROUP_IDS }}
          TENCENT_EKS_CI_IMAGE: ${{ vars.TENCENT_EKS_CI_IMAGE }}
          TENCENT_EKS_CI_ALLOWED_REGISTRY_HOST: ${{ vars.TENCENT_EKS_CI_ALLOWED_REGISTRY_HOST }}
          TENCENT_EKS_CI_AUTO_CREATE_EIP: "true"
          TENCENT_EKS_CI_EIP_BANDWIDTH_MBPS: ${{ vars.TENCENT_EKS_CI_EIP_BANDWIDTH_MBPS || '5' }}
          TENCENT_EKS_CI_EIP_ISP: ${{ vars.TENCENT_EKS_CI_EIP_ISP || 'BGP' }}
          TENCENT_EKS_CI_DRY_RUN: "true"
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          AI_SEARCH_INSTANCE_NAME: ${{ vars.AI_SEARCH_INSTANCE_NAME }}
          SCAN_QUEUE_NAME: ${{ vars.SCAN_QUEUE_NAME }}
          DEADLETTER_QUEUE_NAME: ${{ vars.DEADLETTER_QUEUE_NAME }}
        run: node scripts/render-wrangler-config.mjs config/wrangler.tencent.template.toml work/wrangler.${{ inputs.environment }}.toml
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run --config work/wrangler.${{ inputs.environment }}.toml
      - name: Apply additive migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply "${{ vars.D1_DATABASE_NAME }}" --remote --config work/wrangler.${{ inputs.environment }}.toml
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config work/wrangler.${{ inputs.environment }}.toml
      - name: Synchronize runtime secrets without command-line disclosure
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AGENT_TOKEN_SECRET: ${{ secrets.AGENT_TOKEN_SECRET }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          set -euo pipefail
          for name in AGENT_TOKEN_SECRET TENCENT_SECRET_ID TENCENT_SECRET_KEY; do
            test -n "${!name}" || { echo "missing protected secret: ${name}" >&2; exit 1; }
            printf '%s' "${!name}" | npx wrangler secret put "${name}" --config work/wrangler.${{ inputs.environment }}.toml
          done
      - name: Verify the custom callback domain
        env:
          CALLBACK_BASE_URL: ${{ vars.CALLBACK_BASE_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 15 "${CALLBACK_BASE_URL}/health" | grep -q '"service":"scan-mvp-api"'; then
              exit 0
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "custom callback domain did not become healthy: ${CALLBACK_BASE_URL}" >&2
              exit 1
            fi
            sleep 15
          done
      - name: Promote approved deployment to live provider
        if: inputs.enable_live_provider
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module -e "import fs from 'node:fs';const p='work/wrangler.${{ inputs.environment }}.toml';const s=fs.readFileSync(p,'utf8');const marker='TENCENT_EKS_CI_DRY_RUN = \"true\"';if(s.split(marker).length!==2)throw new Error('expected exactly one dry-run marker');fs.writeFileSync('work/wrangler.${{ inputs.environment }}.live.toml',s.replace(marker,'TENCENT_EKS_CI_DRY_RUN = \"false\"'))"
          npx wrangler deploy --dry-run --config work/wrangler.${{ inputs.environment }}.live.toml
          npx wrangler deploy --config work/wrangler.${{ inputs.environment }}.live.toml
