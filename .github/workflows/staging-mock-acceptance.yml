name: staging-real-mock-acceptance

on:
  workflow_dispatch:
    inputs:
      approval_reference:
        description: Explicit approval reference for one real staging mock instance
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-live-provider
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      STAGING_BASE_URL: ${{ vars.CALLBACK_BASE_URL }}
      STAGING_ADMIN_TOKEN: ${{ secrets.STAGING_ADMIN_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify immutable Agent image
        env:
          IMAGE: ${{ vars.TENCENT_EKS_CI_IMAGE }}
        run: cosign verify "$IMAGE" --certificate-identity-regexp="^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/build-agent.yml@refs/.+$" --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      - name: Validate explicit approval reference
        env:
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: test -n "$APPROVAL_REFERENCE"
      - name: Render staging dry-run configuration
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          WORKER_CUSTOM_DOMAIN: ${{ vars.WORKER_CUSTOM_DOMAIN }}
          ENVIRONMENT: staging
          TOKEN_SCOPE_ENFORCEMENT: report
          CALLBACK_BASE_URL: ${{ vars.CALLBACK_BASE_URL }}
          AGENT_SCAN_MODE: mock
          AGENT_MAX_CANDIDATES: "100"
          TENCENT_EKS_CI_REGION: ${{ vars.TENCENT_EKS_CI_REGION }}
          TENCENT_EKS_CI_VPC_ID: ${{ vars.TENCENT_EKS_CI_VPC_ID }}
          TENCENT_EKS_CI_SUBNET_ID: ${{ vars.TENCENT_EKS_CI_SUBNET_ID }}
          TENCENT_EKS_CI_SECURITY_GROUP_IDS: ${{ vars.TENCENT_EKS_CI_SECURITY_GROUP_IDS }}
          TENCENT_EKS_CI_IMAGE: ${{ vars.TENCENT_EKS_CI_IMAGE }}
          TENCENT_EKS_CI_ALLOWED_REGISTRY_HOST: ${{ vars.TENCENT_EKS_CI_ALLOWED_REGISTRY_HOST }}
          TENCENT_EKS_CI_AUTO_CREATE_EIP: "true"
          TENCENT_EKS_CI_EIP_BANDWIDTH_MBPS: ${{ vars.TENCENT_EKS_CI_EIP_BANDWIDTH_MBPS || '5' }}
          TENCENT_EKS_CI_EIP_ISP: ${{ vars.TENCENT_EKS_CI_EIP_ISP || 'BGP' }}
          TENCENT_EKS_CI_DRY_RUN: "true"
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          AI_SEARCH_INSTANCE_NAME: ${{ vars.AI_SEARCH_INSTANCE_NAME }}
          SCAN_QUEUE_NAME: ${{ vars.SCAN_QUEUE_NAME }}
          DEADLETTER_QUEUE_NAME: ${{ vars.DEADLETTER_QUEUE_NAME }}
        run: |
          node scripts/render-wrangler-config.mjs config/wrangler.tencent.template.toml work/wrangler.staging.toml
          node --input-type=module -e "import fs from 'node:fs';const p='work/wrangler.staging.toml';const lines=fs.readFileSync(p,'utf8').split(/\r?\n/);const routes=lines.filter(line=>line.startsWith('routes = ')&&line.includes('custom_domain = true'));if(routes.length!==1)throw new Error('expected exactly one managed custom-domain route');fs.writeFileSync(p,lines.filter(line=>line!==routes[0]).join('\n'))"
          node --input-type=module -e "import fs from 'node:fs';const p='work/wrangler.staging.toml';let s=fs.readFileSync(p,'utf8');for(const [from,to] of [['TENCENT_EKS_CI_DRY_RUN = \"true\"','TENCENT_EKS_CI_DRY_RUN = \"false\"'],['TASK_MAX_RETRY = \"1\"','TASK_MAX_RETRY = \"0\"']]){if(s.split(from).length!==2)throw new Error('expected exactly one '+from);s=s.replace(from,to)}fs.writeFileSync('work/wrangler.staging.live.toml',s)"
      - name: Refresh staging dry-run Worker
        run: |
          npx wrangler deploy --dry-run --config work/wrangler.staging.toml
          npx wrangler deploy --config work/wrangler.staging.toml
      - name: Verify zero-instance precondition
        run: node scripts/run-staging-mock-acceptance.mjs verify-dry-run
      - name: Deploy approved live staging Worker
        timeout-minutes: 5
        run: |
          npx wrangler deploy --dry-run --config work/wrangler.staging.live.toml
          npx wrangler deploy --config work/wrangler.staging.live.toml
      - name: Verify live Queue consumer propagation
        timeout-minutes: 3
        run: node scripts/run-staging-mock-acceptance.mjs verify-live-consumer
      - name: Run one real mock container acceptance
        timeout-minutes: 10
        run: node scripts/run-staging-mock-acceptance.mjs run
      - name: Restore staging dry-run Worker
        if: always()
        timeout-minutes: 5
        run: npx wrangler deploy --config work/wrangler.staging.toml
      - name: Verify rollback and Tencent cleanup
        if: always()
        timeout-minutes: 7
        env:
          ACCEPTANCE_CLEANUP_WAIT_MS: "300000"
        run: node scripts/run-staging-mock-acceptance.mjs verify-dry-run
      - name: Upload sanitized acceptance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-real-mock-acceptance-${{ github.run_id }}
          path: work/staging-mock-acceptance.json
          if-no-files-found: warn
          retention-days: 30
