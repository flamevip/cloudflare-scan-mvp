name = "{{WORKER_NAME}}"
# This rendered config lives under work/, so source and migration paths are
# relative to that directory rather than to the repository root.
main = "../worker/src/index.ts"
compatibility_date = "2026-06-03"
routes = [{ pattern = "{{WORKER_CUSTOM_DOMAIN}}", custom_domain = true }]

[vars]
ENV = "{{ENVIRONMENT}}"
DEFAULT_PROJECT_ID = "project-default"
TOKEN_SCOPE_ENFORCEMENT = "{{TOKEN_SCOPE_ENFORCEMENT}}"
MOCK_AGENT_MODE = "manual"
AGENT_PROVIDER = "tencent_eks_ci"
CALLBACK_BASE_URL = "{{CALLBACK_BASE_URL}}"
AGENT_SCAN_MODE = "{{AGENT_SCAN_MODE}}"
HUNTER_ENABLED = "false"
AI_SEARCH_ENABLED = "true"
AI_SEARCH_LIMIT = "10"
TASK_MAX_RETRY = "{{TASK_MAX_RETRY}}"
AGENT_HEARTBEAT_TIMEOUT_SECONDS = "600"
AGENT_HEARTBEAT_INTERVAL_SECONDS = "30"
AGENT_MAX_CANDIDATES = "{{AGENT_MAX_CANDIDATES}}"
ARTIFACT_RETENTION_DAYS = "30"
METADATA_RETENTION_DAYS = "180"
AUDIT_RETENTION_DAYS = "180"
TENCENT_EKS_CI_REGION = "{{TENCENT_EKS_CI_REGION}}"
TENCENT_EKS_CI_VPC_ID = "{{TENCENT_EKS_CI_VPC_ID}}"
TENCENT_EKS_CI_SUBNET_ID = "{{TENCENT_EKS_CI_SUBNET_ID}}"
TENCENT_EKS_CI_SECURITY_GROUP_IDS = "{{TENCENT_EKS_CI_SECURITY_GROUP_IDS}}"
TENCENT_EKS_CI_IMAGE = "{{TENCENT_EKS_CI_IMAGE}}"
TENCENT_EKS_CI_ALLOWED_REGISTRY_HOST = "{{TENCENT_EKS_CI_ALLOWED_REGISTRY_HOST}}"
TENCENT_EKS_CI_CONTAINER_NAME = "scan-agent"
TENCENT_EKS_CI_CPU = "1"
TENCENT_EKS_CI_MEMORY = "2"
TENCENT_EKS_CI_API_TIMEOUT_MS = "10000"
TENCENT_EKS_CI_AUTO_CREATE_EIP = "{{TENCENT_EKS_CI_AUTO_CREATE_EIP}}"
TENCENT_EKS_CI_EIP_BANDWIDTH_MBPS = "{{TENCENT_EKS_CI_EIP_BANDWIDTH_MBPS}}"
TENCENT_EKS_CI_EIP_ISP = "{{TENCENT_EKS_CI_EIP_ISP}}"
TENCENT_EKS_CI_DRY_RUN = "{{TENCENT_EKS_CI_DRY_RUN}}"
TENCENT_EKS_CI_READONLY_PREFLIGHT_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "{{D1_DATABASE_NAME}}"
database_id = "{{D1_DATABASE_ID}}"
migrations_dir = "../migrations/d1"

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "{{R2_BUCKET_NAME}}"

[[ai_search]]
binding = "AI_SEARCH"
instance_name = "{{AI_SEARCH_INSTANCE_NAME}}"

[[queues.producers]]
binding = "SCAN_DISPATCH"
queue = "{{SCAN_QUEUE_NAME}}"

[[queues.producers]]
binding = "SCAN_DEADLETTER"
queue = "{{DEADLETTER_QUEUE_NAME}}"

[[queues.consumers]]
queue = "{{SCAN_QUEUE_NAME}}"
max_batch_size = 1
max_batch_timeout = 5

[triggers]
crons = ["*/10 * * * *"]
